name: Crea APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepara icone e componente Excel
        run: bash tools/prepare.sh

      - name: Chiave di firma
        run: bash tools/keystore.sh

      - name: Compila l'APK
        run: bash tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: IMieiAffitti-apk
          path: IMieiAffitti-*.apk

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: I miei Affitti 1.0.${{ github.run_number }}
          body: |
            Scarica il file **.apk** qui sotto dal telefono e aprilo per installarlo o aggiornarlo.
            I dati già inseriti restano sul telefono anche dopo l'aggiornamento.
          files: IMieiAffitti-*.apk
          make_latest: true
