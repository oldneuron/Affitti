<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17613d">
<meta name="description" content="Tieni traccia dei pagamenti degli affitti">
<title>I miei Affitti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f6f4; --card:#fff; --ink:#15201a; --muted:#5f6f66; --line:#e1e8e4;
  --acc:#17613d; --acc2:#1f8a55; --accSoft:#e3f2ea;
  --ok:#1f8a55; --okSoft:#e3f2ea; --warn:#a86400; --warnSoft:#fdf1dc;
  --bad:#b3261e; --badSoft:#fbe5e3; --fut:#7d8b83; --futSoft:#eef1ef;
  --barDue:#c9d3cd; --barPaid:#1f8a55; --grid:#e6ece8;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1512;--card:#18211c;--ink:#e8efea;--muted:#9aaba1;--line:#26332c;
  --accSoft:#1c3a2a;--okSoft:#1c3a2a;--ok:#5fcf93;--warnSoft:#3a2c12;--warn:#f0b454;
  --badSoft:#3d1c1a;--bad:#ff8a80;--futSoft:#1f2924;--fut:#7d8b83;--acc2:#5fcf93;
  --barDue:#3a4740;--barPaid:#4cc285;--grid:#222d27}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--acc);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:19px;margin:0;flex:1;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:13px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.14);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:#fff;flex:none}
.ib svg{width:22px;height:22px}
.chips{margin-top:10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap;font-size:14px}
.chip.on{background:#fff;color:var(--acc);font-weight:600}
.chips.light .chip{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chips.light .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav .in{display:flex;width:100%;max-width:680px}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;border-radius:12px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc2);font-weight:600}
nav button.on svg{background:var(--accSoft);border-radius:999px;padding:2px 14px;width:52px;box-sizing:content-box;margin:0 -14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);min-width:0}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.bad .v{color:var(--bad)} .stat.good .v{color:var(--ok)}
.yrs{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.yrs b{font-size:18px}
.yrs button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:38px;font-size:20px}
.yrs button:disabled{opacity:.35}
.list{display:flex;flex-direction:column;gap:8px}
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:5px solid var(--fut)}
.m.pagato{border-left-color:var(--ok)} .m.parziale{border-left-color:var(--warn)}
.m.ritardo{border-left-color:var(--bad)} .m.scadenza{border-left-color:var(--acc2)}
.m.futuro,.m.fuori{opacity:.7}
.m .t{flex:1;min-width:0}
.m .n{font-weight:600}
.m .n .mn{text-transform:capitalize}
.m .s{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.pagato{background:var(--okSoft);color:var(--ok)} .tag.parziale{background:var(--warnSoft);color:var(--warn)}
.tag.ritardo{background:var(--badSoft);color:var(--bad)} .tag.scadenza{background:var(--accSoft);color:var(--acc2)}
.tag.futuro,.tag.fuori{background:var(--futSoft);color:var(--fut)}
.quick{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:14px;padding:13px 16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.sec{background:var(--accSoft);color:var(--acc2)}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:16px}
.card .cs{font-size:13px;color:var(--muted);margin-bottom:10px}
/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bd{fill:var(--barDue)} .chart .bp{fill:var(--barPaid)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{fill:var(--ink);opacity:.06}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:2px 0 6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.readout{min-height:22px;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:4px}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:14px;background:var(--futSoft);border-radius:4px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--barPaid);border-radius:0 4px 4px 0}
.hb .vv{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);min-width:70px;text-align:right}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:84px;height:84px;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
details summary{cursor:pointer;color:var(--acc2);font-size:14px;margin-top:8px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:680px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sh h2{margin:0 0 4px;font-size:20px}
.sh h2 .mn{text-transform:capitalize}
.sh .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc2)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fld input,.fld select{min-width:0;max-width:100%}
input[type=month],input[type=date]{min-height:46px}
.pay{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pay .t{flex:1;font-size:14.5px}
.pay .a{font-weight:700;font-variant-numeric:tabular-nums}
.x{border:0;background:var(--badSoft);color:var(--bad);border-radius:10px;padding:6px 10px;font-size:13px}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.rate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px;align-items:center}
.rate input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;width:100%;min-width:0}
.prog{height:8px;background:var(--futSoft);border-radius:9px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2a23;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.gap{height:10px}
.muted{color:var(--muted);font-size:13.5px}
.note{background:var(--accSoft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div style="flex:1;min-width:0"><h1 id="title">I miei Affitti</h1><div class="hsub" id="hsub"></div></div>
    <button class="ib" id="bSet" aria-label="Impostazioni immobile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </div>
  <div class="chips" id="propsel"></div>
</header>
<main id="main"></main>
<nav><div class="in">
  <button data-tab="mesi" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Pagamenti</button>
  <button data-tab="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistiche</button>
  <button data-tab="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Esporta</button>
</div></nav>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="toast" id="toast"></div>
<script src="xlsx.mini.min.js"></script>
<script src="app.js"></script>
</body>
</html>
